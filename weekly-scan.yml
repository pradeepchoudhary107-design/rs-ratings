# ── 2. RS score for one symbol ─────────────────────────────
def calc_rs(sym_ns, start, end):
    try:
        hist = yf.download(sym_ns, start=start, end=end,
                           progress=False, auto_adjust=True)
        if hist.empty or len(hist) < 150:
            return None
        p = hist["Close"].squeeze()
        if len(p) < 63:
            return None

        c_now = float(p.iloc[-1])
        c_3m  = float(p.iloc[-63])
        c_6m  = float(p.iloc[-126]) if len(p) >= 126 else float(p.iloc[0])
        c_9m  = float(p.iloc[-189]) if len(p) >= 189 else float(p.iloc[0])
        c_12m = float(p.iloc[-252]) if len(p) >= 252 else float(p.iloc[0])

        q4 = (c_now - c_3m)  / c_3m
        q3 = (c_3m  - c_6m)  / c_6m
        q2 = (c_6m  - c_9m)  / c_9m
        q1 = (c_9m  - c_12m) / c_12m
        score = 0.40*q4 + 0.20*q3 + 0.20*q2 + 0.20*q1

        high_52w  = float(p.iloc[-252:].max()) if len(p) >= 252 else float(p.max())
        ret_1m    = round(((c_now - float(p.iloc[-21])) / float(p.iloc[-21]))*100, 1) if len(p) >= 21 else 0
        ret_3m    = round(((c_now - c_3m) / c_3m)*100, 1)
        ret_12m   = round(((c_now - c_12m) / c_12m)*100, 1)
        from_high = round(((c_now - high_52w) / high_52w)*100, 1)

        return {
            "sym":   sym_ns.replace(".NS", ""),
            "score": score,
            "price": round(c_now, 1),
            "r1m":   ret_1m,
            "r3m":   ret_3m,
            "r12m":  ret_12m,
            "h52":   round(high_52w, 1),
            "fh":    from_high,
        }
    except Exception:
        return None


# ── 3. Build color-coded Excel ─────────────────────────────
def build_excel(df, fname):
    from openpyxl.styles import PatternFill, Font, Alignment, Border, Side
    from openpyxl.utils import get_column_letter

    cols = ["Rank","Symbol","RS Rating","Strength","Price (Rs)",
            "1M Ret%","3M Ret%","12M Ret%","52W High","From 52W High%"]

    display = df.rename(columns={
        "rank":"Rank","sym":"Symbol","rs":"RS Rating","strength":"Strength",
        "price":"Price (Rs)","r1m":"1M Ret%","r3m":"3M Ret%","r12m":"12M Ret%",
        "h52":"52W High","fh":"From 52W High%",
    })[cols]

    with pd.ExcelWriter(fname, engine="openpyxl") as writer:
        display.to_excel(writer, sheet_name="RS Ratings", index=False)
        ws = writer.sheets["RS Ratings"]

        # Header
        hdr_fill = PatternFill("solid", fgColor="111111")
        thin = Border(
            left=Side(style="thin", color="222222"),
            right=Side(style="thin", color="222222"),
            bottom=Side(style="thin", color="222222"),
        )
        for cell in ws[1]:
            cell.fill = hdr_fill
            cell.font = Font(color="FFFFFF", bold=True, size=11)
            cell.alignment = Alignment(horizontal="center")

        # Rows
        for row_idx in range(2, len(display) + 2):
            rs = ws.cell(row=row_idx, column=3).value
            if   rs >= 90: bg, fg = "085041", "9FE1CB"
            elif rs >= 80: bg, fg = "27500A", "C0DD97"
            elif rs >= 60: bg, fg = "633806", "FAC775"
            else:          bg, fg = "791F1F", "F7C1C1"
            fill = PatternFill("solid", fgColor=bg)
            font = Font(color=fg, size=10)
            for col_idx in range(1, len(cols) + 1):
                c = ws.cell(row=row_idx, column=col_idx)
                c.fill = fill
                c.font = font
                c.alignment = Alignment(horizontal="center")
                c.border = thin

        # Column widths
        for i, w in enumerate([6,16,11,13,12,10,10,12,12,16], 1):
            ws.column_dimensions[get_column_letter(i)].width = w

        # Freeze header
        ws.freeze_panes = "A2"

    print(f"  Excel saved: {fname}")


# ── 4. Send email with Excel attachment ────────────────────
def send_email(excel_path, df, date_str):
    if not EMAIL_PASSWORD:
        print("  EMAIL_PASSWORD not set — skipping email.")
        return

    exc_count = len(df[df["rs"] >= 90])
    str_count = len(df[(df["rs"] >= 80) & (df["rs"] < 90)])
    top5 = df.head(5)["sym"].tolist()

    subject = f"NSE RS Rating Report — {date_str} | {exc_count} Exceptional stocks"

    # HTML email body
    top5_rows = ""
    for _, row in df.head(10).iterrows():
        if row["rs"] >= 90:   bg, fg = "#085041", "#9FE1CB"
        elif row["rs"] >= 80: bg, fg = "#27500A", "#C0DD97"
        else:                 bg, fg = "#633806", "#FAC775"
        star = "★" if row["rs"] >= 90 else "◆"
        top5_rows += f"""
        <tr>
          <td style="padding:8px 12px;border-bottom:1px solid #222">{int(row['rank'])}</td>
          <td style="padding:8px 12px;border-bottom:1px solid #222;font-weight:600">{row['sym']}</td>
          <td style="padding:8px 12px;border-bottom:1px solid #222">
            <span style="background:{bg};color:{fg};padding:3px 10px;border-radius:5px;font-weight:700">
              {row['rs']} {star}
            </span>
          </td>
          <td style="padding:8px 12px;border-bottom:1px solid #222;color:{'#1D9E75' if row['r12m']>=0 else '#E24B4A'}">{row['r12m']}%</td>
        </tr>"""

    body_html = f"""
    <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;padding:2rem;max-width:640px;margin:0 auto">
      <div style="background:#111;border-radius:12px;padding:1.5rem;margin-bottom:1rem">
        <h1 style="color:#fff;font-size:1.2rem;font-weight:500;margin:0 0 4px">NSE RS Rating — Weekly Report</h1>
        <p style="color:#555;font-size:13px;margin:0">{date_str}</p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:1rem">
        <div style="background:#111;border-radius:8px;padding:1rem;text-align:center">
          <div style="color:#555;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Total Scanned</div>
          <div style="color:#fff;font-size:24px;font-weight:500">{len(df)}</div>
        </div>
        <div style="background:#0a2218;border:1px solid #085041;border-radius:8px;padding:1rem;text-align:center">
          <div style="color:#1D9E75;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Exceptional 90+</div>
          <div style="color:#9FE1CB;font-size:24px;font-weight:500">{exc_count}</div>
        </div>
        <div style="background:#0e1f07;border:1px solid #27500A;border-radius:8px;padding:1rem;text-align:center">
          <div style="color:#639922;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Strong 80+</div>
          <div style="color:#C0DD97;font-size:24px;font-weight:500">{str_count}</div>
        </div>
      </div>

      <div style="background:#111;border-radius:12px;padding:1.5rem;margin-bottom:1rem">
        <h2 style="color:#aaa;font-size:13px;font-weight:500;margin:0 0 1rem;text-transform:uppercase;letter-spacing:.05em">Top 10 Stocks</h2>
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <tr style="color:#555">
            <th style="text-align:left;padding:6px 12px;font-weight:500">Rank</th>
            <th style="text-align:left;padding:6px 12px;font-weight:500">Symbol</th>
            <th style="text-align:left;padding:6px 12px;font-weight:500">RS Rating</th>
            <th style="text-align:left;padding:6px 12px;font-weight:500">12M Ret</th>
          </tr>
          {top5_rows}
        </table>
      </div>

      <p style="color:#444;font-size:12px;text-align:center;margin:0">
        Full Excel report attached &nbsp;·&nbsp; Auto-generated every Saturday
      </p>
    </div>
    """

    msg = MIMEMultipart("alternative")
    msg["Subject"] = subject
    msg["From"]    = EMAIL_SENDER
    msg["To"]      = EMAIL_TO
    msg.attach(MIMEText(body_html, "html"))

    # Attach Excel
    with open(excel_path, "rb") as f:
        part = MIMEBase("application", "octet-stream")
        part.set_payload(f.read())
    encoders.encode_base64(part)
    part.add_header("Content-Disposition",
                    f'attachment; filename="{os.path.basename(excel_path)}"')
    msg.attach(part)

    try:
        with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
            server.login(EMAIL_SENDER, EMAIL_PASSWORD)
            server.sendmail(EMAIL_SENDER, EMAIL_TO, msg.as_string())
        print(f"  Email sent to {EMAIL_TO}")
    except Exception as e:
        print(f"  Email failed: {e}")


# ── 5. Main ────────────────────────────────────────────────
def main():
    t0 = time.time()
    date_str = datetime.now().strftime("%d %b %Y")
    print(f"\n{'='*55}")
    print(f"  NSE RS Rating Scan — {date_str}")
    print(f"{'='*55}\n")

    symbols = get_nse_symbols()
    end     = datetime.today()
    start   = end - timedelta(days=420)
    results = []

    print(f"Scanning {len(symbols)} stocks...")
    for i, sym in enumerate(symbols):
        r = calc_rs(f"{sym}.NS", start, end)
        if r:
            results.append(r)
        if (i + 1) % 100 == 0:
            elapsed = time.time() - t0
            rate    = elapsed / (i + 1)
            rem     = rate * (len(symbols) - i - 1) / 60
            print(f"  [{i+1}/{len(symbols)}] {len(results)} ok | ~{rem:.0f} min left")
        time.sleep(0.3)

    if not results:
        print("No results — aborting.")
        return

    # Rank 1-99
    df = pd.DataFrame(results)
    df["rs"] = df["score"].rank(pct=True).apply(
        lambda p: max(1, min(99, round(1 + p * 98)))
    ).astype(int)
    df = df.sort_values("rs", ascending=False).drop(columns=["score"])
    df["rank"] = range(1, len(df) + 1)
    df["strength"] = df["rs"].apply(
        lambda r: "Exceptional" if r >= 90 else
                  ("Strong" if r >= 80 else
                  ("Average" if r >= 60 else "Weak"))
    )

    # Save JSON for dashboard
    records = df.to_dict(orient="records")
    payload = {
        "updated":     datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
        "updated_ist": datetime.now().strftime("%d %b %Y %I:%M %p IST"),
        "total":       len(records),
        "stocks":      records,
    }
    os.makedirs("docs", exist_ok=True)
    with open("docs/data.json", "w") as f:
        json.dump(payload, f, separators=(",", ":"))
    print(f"\n  JSON saved: docs/data.json ({len(records)} stocks)")

    # Build Excel
    ts       = datetime.now().strftime("%Y%m%d")
    xl_fname = f"NSE_RS_Rating_{ts}.xlsx"
    build_excel(df, xl_fname)

    # Send email
    print("\nSending email...")
    send_email(xl_fname, df, date_str)

    elapsed_min = round((time.time() - t0) / 60, 1)
    exc = len(df[df["rs"] >= 90])
    print(f"\n{'='*55}")
    print(f"  DONE in {elapsed_min} min | {len(df)} stocks | {exc} Exceptional")
    print(f"{'='*55}\n")


if __name__ == "__main__":
    main()
